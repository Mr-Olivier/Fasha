# -----------------------------------------------------------------------------
# Main application configuration.
#
# Beginner note: values written as ${VAR_NAME:default} read an environment
# variable called VAR_NAME, and fall back to the text after the colon if that
# variable isn't set. This is how we keep passwords and secrets OUT of git
# (see backend/.env.example for the variables you should set locally).
# -----------------------------------------------------------------------------

spring:
  application:
    name: kazilink-backend

  datasource:
    # DB_HOST defaults to localhost for local dev (running the backend
    # directly on the host, talking to docker-compose's Postgres via its
    # published port). When the BACKEND itself also runs in a container
    # (see backend/Dockerfile + the root docker-compose.yml's "backend"
    # service), "localhost" would mean the backend container itself, not
    # the postgres one - that service sets DB_HOST=postgres (the Compose
    # service name, resolved via Docker's internal DNS) and DB_PORT=5432
    # (postgres's own in-network port, not the 5433 host-mapping below).
    #
    # Port 5433, not 5432, for the DEFAULT here specifically: our
    # docker-compose Postgres is mapped there on the HOST to avoid
    # clashing with any native PostgreSQL already installed on the
    # machine. Override with DB_PORT if your setup differs.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/kazilink
    username: ${DB_USERNAME:kazilink}
    password: ${DB_PASSWORD:kazilink}

  data:
    redis:
      # Same REDIS_HOST override story as DB_HOST above - defaults to
      # localhost for a backend running on the host against
      # docker-compose's Redis (published on its default 6379, no port
      # remap needed here since nothing else on this machine claims it);
      # the compose "backend" service overrides this to "redis".
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      # IMPORTANT: we never let Hibernate create/alter tables automatically.
      # Flyway (below) is the single source of truth for the database schema,
      # via versioned SQL files in src/main/resources/db/migration.
      # "validate" just double-checks our Java entities match that schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # One global limit for every multipart endpoint - avatars
      # (AvatarStorageService), booking photos, and chat attachments
      # (MessageService.sendAttachment) alike. Sized for chat's video
      # attachments (up to chatVideoMaxDuration = 3 min of uncompressed
      # phone camera footage), not just a small profile picture -
      # MaxUploadSizeExceededException past this is turned into a clean 400
      # by GlobalExceptionHandler instead of the raw 500 Spring would
      # otherwise send.
      max-file-size: 100MB
      max-request-size: 100MB

server:
  # 8081, not the default 8080: something else on this machine already
  # holds 8080. Override with SERVER_PORT if you need a different one.
  port: ${SERVER_PORT:8081}

# Custom settings for our own code (read via @ConfigurationProperties or @Value).
app:
  jwt:
    # A long random string used to sign JWTs. NEVER commit a real one -
    # always override this with the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-make-me-long-and-random}
    # Short-lived on purpose now that refresh-token rotation exists
    # (RefreshTokenService) - a leaked access token is only useful for this
    # long. The mobile app transparently trades an expired one in for a new
    # pair via POST /api/auth/refresh, so this being short doesn't mean
    # "log the user out every 15 minutes".
    expiration-ms: 900000 # 15 minutes, in milliseconds
    refresh-expiration-ms: 2592000000 # 30 days, in milliseconds

  # Where AvatarStorageService writes uploaded avatar files, and where
  # StaticResourceConfig serves them back from. Relative to wherever the
  # backend process is started from - fine for local dev; a real deployment
  # would point this at a persistent volume or object storage instead.
  uploads-dir: uploads

  # Where SecureFileStorageService writes KYC documents and booking photos -
  # a SIBLING directory to uploads-dir, not nested under it, so those files
  # can never become reachable through StaticResourceConfig's public
  # "/uploads/**" handler no matter how that glob changes later. Only ever
  # served back through an authenticated controller endpoint that checks
  # the caller owns (or, for KYC documents, administers) the resource.
  secure-uploads-dir: secure-uploads

  brevo:
    # From https://app.brevo.com/settings/keys/api - leave unset and
    # BrevoEmailService just logs each OTP code instead of emailing it,
    # so local dev works fully without a Brevo account.
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:no-reply@kazilink.rw}
    sender-name: ${BREVO_SENDER_NAME:KaziLink Rwanda}

  google:
    # The OAuth "Web application" client ID from Google Cloud Console - see
    # NEXT_SESSION.md for the full setup checklist. Every platform's Google
    # Sign-In (Android, web, ...) requests an ID token audienced to THIS
    # one client ID (via serverClientId/clientId on the Flutter side, see
    # GoogleAuthService), so a single value here verifies all of them - no
    # per-platform backend config, and the exact same code runs in local
    # dev and production; only this value differs. Leave unset and every
    # OTHER endpoint still works fine - only POST /api/auth/google fails,
    # with a clear GoogleSignInNotConfiguredException, until it's set (see
    # GoogleTokenService).
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

  firebase:
    # Absolute (or working-directory-relative) path to a Firebase service
    # account JSON key file - Project Settings > Service Accounts >
    # "Generate new private key" in the Firebase console. See
    # NEXT_SESSION.md for the full setup checklist. Leave unset and
    # PushNotificationService just logs what it would have sent instead of
    # calling Firebase, so local dev and CI work fully with no real
    # Firebase project at all - same "optional third-party integration"
    # pattern as app.brevo/app.google above.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

logging:
  level:
    rw.kazilink: DEBUG
